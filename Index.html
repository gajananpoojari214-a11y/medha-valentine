<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medha 💖 Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: 'Comic Sans MS', cursive;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  text-align:center;
  overflow:hidden;
}

.container{
  margin-top:40px;
  position:relative;
}

img{
  width:260px;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{ color:white; font-size:2.4em; }
p{ color:white; font-size:1.2em; }

button{
  padding:14px 28px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  margin:10px;
}

#yes{
  background:#ff4d6d;
  color:white;
}

#no{
  background:white;
  color:#ff4d6d;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

.heart{
  position:fixed;
  animation:float 4s linear infinite;
  font-size:20px;
}

@keyframes float{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-800px);opacity:0;}
}
</style>
</head>

<body>

<div class="container">
  <img src="https://i.pinimg.com/736x/64/93/4c/64934cb1e02a0faeab2a42f7a7f3e5a7.jpg">
  <h1>Medha 💕</h1>
  <p>
    Just like Bubu loves Dudu 🐻🐼<br>
    Will you be my Valentine? 💖
  </p>

  <button id="yes" onclick="yesClick()">YES 🥰</button>
  <button id="no" onmouseover="moveNo()">NO 🙈</button>
</div>

<script>
function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-IN";
  msg.rate = 0.9;
  msg.pitch = 1.2;
  window.speechSynthesis.speak(msg);
}

function yesClick(){
  speak("Yay Medha! You are my Dudu and I am your Bubu. Forever and always.");

  document.body.innerHTML = `
  <h1 style="margin-top:35vh;color:white;">
    YAYYYY MEDHA 💖<br><br>
    You are my Dudu 🐼<br>
    I am your Bubu 🐻
  </h1>`;
}

function moveNo(){
  let x = Math.random() * (window.innerWidth - 100);
  let y = Math.random() * (window.innerHeight - 50);
  const no = document.getElementById("no");
  no.style.left = x + "px";
  no.style.top = y + "px";
}

setInterval(()=>{
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";
  heart.style.left = Math.random()*100 + "vw";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),4000);
},300);
</script>

</body>
</html>
